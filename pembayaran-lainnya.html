<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran Lainnya - Web App X</title>
  
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
  <style>
    /* Specific styles for Placeholder Page using Azure Sky Cloud guidelines */
    .placeholder-container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      height: 60vh;
      text-align: center;
      padding: 2rem;
      background-color: var(--color-surface);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -1px rgba(15, 23, 42, 0.03);
      border: 1px solid var(--color-border);
      max-width: 600px;
      margin: 0 auto;
    }
    .placeholder-icon {
      background-color: var(--color-background);
      color: var(--color-primary);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .placeholder-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    .placeholder-desc {
      font-size: var(--font-base);
      color: var(--color-text-secondary);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .placeholder-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      background-color: var(--color-primary);
      color: white;
      text-decoration: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: var(--font-base);
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }
    .placeholder-btn:hover {
      background-color: var(--color-primary-hover);
      transform: translateY(-1px);
    }
    .placeholder-btn:active {
      transform: translateY(0);
    }
    
    /* Loading Overlay for Navigation */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.5);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .loading-overlay.active {
      display: flex;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--color-primary-light);
      border-top: 4px solid var(--color-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="dashboard-page">

  <script>
    if (!localStorage.getItem("wax_logged_user")) {
      window.location.replace("login.html");
    }
  </script>

  <div class="app-layout-wrapper">
    <!-- Sidebar -->
    <div class="app-sidebar-container">
      <div id="sidebar-slot"></div>
    </div>

    <!-- Main Content -->
    <div class="app-main-content">
      
      <!-- Mobile Header -->
      <header class="app-mobile-header">
        <button type="button" class="app-hamburger-btn" onclick="toggleMobileMenu()" title="Buka Menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="app-title">Pembayaran Lainnya</div>
      </header>

      <!-- Content Body -->
      <main class="app-content-body">
        
        <div class="placeholder-container">
          <div class="placeholder-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>
          <h1 class="placeholder-title">Modul Dalam Pengembangan</h1>
          <p class="placeholder-desc">
            Modul <strong>Pembayaran Lainnya</strong> saat ini masih dalam tahap pengembangan. Fitur ini dipersiapkan dan akan tersedia apabila terdapat kebutuhan bisnis selain pembayaran EUPD dan Ekspedisi Pihak Ketiga di masa mendatang.
          </p>
          <button class="placeholder-btn" onclick="navigateWithLoading('pembayaran.html')">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Kembali ke Menu Pembayaran
          </button>
        </div>

      </main>

    </div>
  </div>

  <!-- Loading Overlay for Navigation -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Load Sidebar using app.js function
      if (typeof loadSidebar === 'function') {
        loadSidebar();
      }
    });

    function navigateWithLoading(url) {
      const loader = document.getElementById('loadingOverlay');
      loader.classList.add('active');
      
      // Simulate loading for better UX, then navigate
      setTimeout(() => {
        window.location.href = url;
      }, 400); 
    }
  </script>
</body>
</html>
